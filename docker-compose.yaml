# Based on gtnh example deployment
# Source https://github.com/itzg/docker-minecraft-server/blob/master/examples/gtnh/docker-compose-type-gtnh.yaml
services:
  mc:
    image: itzg/minecraft-server:java25
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: GTNH
      GTNH_PACK_VERSION: "2.8.4"
      ENABLE_RCON: true
      MEMORY: 8G
      ONLINE_MODE: false
      TZ: "Asia/Kuala_Lumpur"
      ICON: "/icon.png"
      MODS: |
        https://github.com/GTNewHorizons/SharedProspecting/releases/download/2.0.5/sharedprospecting-2.0.5.jar
      DUMP_SERVER_PROPERTIES: "TRUE"
      CREATE_CONSOLE_IN_PIPE: "true"
      RCON_CMDS_STARTUP: |-
        /gamerule keepInventory true
        /gamerule mobGriefing false
        /scoreboard objectives add Deaths deathCount
        /scoreboard objectives add Health health
        /scoreboard objectives setdisplay sidebar Deaths
        /scoreboard objectives setdisplay list Health
      APPLY_EXTRA_FILES: |
        serverutilities</extra/serverutilities.cfg
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA_DIR}:/data
      - ./icon.png:/icon.png:ro
      - ./config:/config:ro
      - ./extra:/extra:ro
    healthcheck:
      test: mc-health
      start_period: 1m
      interval: 5s
      retries: 20
  hourly-tar-backup:
    image: itzg/mc-backup
    restart: unless-stopped
    environment:
      RCON_HOST: mc
      BACKUP_METHOD: tar
      BACKUP_INTERVAL: "2h"
      PRUNE_BACKUPS_COUNT: 6
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA_DIR}:/data:ro
      - ${BACKUP_DIR}:/backups
    depends_on:
      mc:
        condition: service_healthy
  daily-b2-backup:
    image: itzg/mc-backup
    restart: unless-stopped
    environment:
      RCON_HOST: mc
      BACKUP_METHOD: restic
      BACKUP_INTERVAL: "24h"
      PRUNE_BACKUPS_DAYS: 7
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA_DIR}:/data:ro
      - ${BACKUP_DIR}:/backups
      - ./rclone.conf:/config/rclone/rclone.conf:ro
    depends_on:
      mc:
        condition: service_healthy